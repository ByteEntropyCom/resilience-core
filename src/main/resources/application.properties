spring.application.name=resilience-core
server.port=8080

# Virtual threads
spring.threads.virtual.enabled=true

# Resilience4j Configuration
resilience4j.ratelimiter.instances.bankRateLimit.limit-for-period=10
resilience4j.ratelimiter.instances.bankRateLimit.limit-refresh-period=1s
resilience4j.ratelimiter.instances.bankRateLimit.timeout-duration=0

resilience4j.circuitbreaker.instances.bankCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bankCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.bankCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bankCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bankCircuitBreaker.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.bankCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bankCircuitBreaker.record-exceptions=java.lang.RuntimeException,java.util.concurrent.TimeoutException

resilience4j.retry.instances.bankRetry.max-attempts=3
resilience4j.retry.instances.bankRetry.wait-duration=500ms
resilience4j.retry.instances.bankRetry.retry-exceptions=java.lang.RuntimeException,java.util.concurrent.TimeoutException

resilience4j.timelimiter.instances.bankTimeout.timeout-duration=2s
resilience4j.timelimiter.instances.bankTimeout.cancel-running-future=true