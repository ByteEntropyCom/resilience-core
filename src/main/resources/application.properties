spring.application.name=resilience-core
server.port=${SERVER_PORT:8080}

# Virtual threads
spring.threads.virtual.enabled=${VIRTUAL_THREADS_ENABLED:true}

# H2 Configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# Database Schema Management
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Resilience4j - Rate Limiter
resilience4j.ratelimiter.instances.bankRateLimit.limit-for-period=${RATE_LIMIT_COUNT:10}
resilience4j.ratelimiter.instances.bankRateLimit.limit-refresh-period=${RATE_LIMIT_PERIOD:1s}
resilience4j.ratelimiter.instances.bankRateLimit.timeout-duration=${RATE_LIMIT_TIMEOUT:0}

# Resilience4j - Retry
resilience4j.retry.instances.bankRetry.max-attempts=${RETRY_MAX:3}
resilience4j.retry.instances.bankRetry.wait-duration=${RETRY_WAIT:500ms}
resilience4j.retry.instances.bankRetry.retry-exceptions=java.net.ConnectException,java.net.SocketTimeoutException,java.lang.RuntimeException

# Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.bankCircuitBreaker.failure-rate-threshold=${CB_FAILURE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.bankCircuitBreaker.sliding-window-size=${CB_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.bankCircuitBreaker.minimum-number-of-calls=${CB_MIN_CALLS:5}
resilience4j.circuitbreaker.instances.bankCircuitBreaker.sliding-window-type=${CB_WINDOW_TYPE:COUNT_BASED}
resilience4j.circuitbreaker.instances.bankCircuitBreaker.wait-duration-in-open-state=${CB_WAIT_OPEN:5s}
resilience4j.circuitbreaker.instances.bankCircuitBreaker.permitted-number-of-calls-in-half-open-state=${CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.bankCircuitBreaker.record-exceptions=java.lang.RuntimeException,java.util.concurrent.TimeoutException

# Resilience4j - Time Limiter
resilience4j.timelimiter.instances.bankTimeout.timeout-duration=${TIMEOUT_DURATION:2s}
resilience4j.timelimiter.instances.bankTimeout.cancel-running-future=${TIMEOUT_CANCEL_FUTURE:true}

# Expose the monitoring endpoints over HTTP
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSE:health,metrics,prometheus}

# Show detailed health (including Circuit Breaker status)
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:always}
resilience4j.circuitbreaker.metrics.enabled=${CB_METRICS_ENABLED:true}


