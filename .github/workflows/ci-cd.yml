name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Test
    strategy:
      matrix:
        java-version: [ '21', '22' ]
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        # This compiles, tests, and packages your JAR in one go
        run: mvn clean verify -B

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        if: matrix.java-version == '21'
        with:
          name: resilience-core-jar
          path: target/*.jar

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.java-version == '21'
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    name: Code Quality
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run SonarQube analysis
        run: mvn sonar:sonar -Dsonar.projectKey=resilience-core -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check || true
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: target/dependency-check-report.html

  notification:
    runs-on: ubuntu-latest
    name: Notify Results
    needs: [ build, quality, security ]
    if: always()
    steps:
      - name: Build Status Notification
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build Successful"
          else
            echo "❌ Build Failed"
            exit 1
          fi
