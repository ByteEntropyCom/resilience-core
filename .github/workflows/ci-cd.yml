name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

# Set global env to fix Node.js 24 deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Test
    strategy:
      matrix:
        java-version: [ '21', '22' ]
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Run Maven clean
        run: mvn clean

      - name: Run tests
        run: mvn test -B

      - name: Build project
        run: mvn package -DskipTests -B

      - name: Upload coverage reports
        # Updated from v3 to v4
        uses: codecov/codecov-action@v4
        if: matrix.java-version == '21'
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }} # v4 often requires a token

  quality:
    runs-on: ubuntu-latest
    name: Code Quality
    needs: build
    if: always()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run SonarQube analysis
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=resilience-core \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: build
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check || true

      - name: Upload dependency check results
        # FIXED: Updated from v3 to v4 (This was your main error)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  publish:
    runs-on: ubuntu-latest
    name: Publish Artifacts
    needs: [ build, quality, security ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Publish to Maven Central (if configured)
        run: mvn deploy -DskipTests -B
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        continue-on-error: true

  notification:
    runs-on: ubuntu-latest
    name: Notify Results
    needs: [ build, quality, security, publish ]
    if: always()

    steps:
      - name: Build Status Notification
        run: |
          if [ "${{ needs.build.result }}" == "failure" ] || \
             [ "${{ needs.quality.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ]; then
            echo "❌ Build Pipeline Failed"
            exit 1
          else
            echo "✅ Build Pipeline Successful"
          fi
