name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_security_scan:
        description: 'Run OWASP Security Scan?'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Test (Java ${{ matrix.java-version }})
    strategy:
      matrix:
        java-version: [ '21', '22' ]
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean verify -B

      - name: Upload JAR Artifact
        if: matrix.java-version == '21' && success()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-core-v${{ github.run_number }}
          path: target/*.jar

  quality:
    runs-on: ubuntu-latest
    name: Code Quality
    needs: build
    if: success() # Only run if build passes
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run SonarQube analysis
        continue-on-error: true
        run: mvn sonar:sonar -Dsonar.projectKey=resilience-core -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: build
    if: success() && (github.event_name != 'workflow_dispatch' || inputs.run_security_scan == true)
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
          -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
          -DfailOnError=false

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: target/dependency-check-report.html
